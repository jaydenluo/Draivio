[package]
name = "draivio"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "draivio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }

httpdate = "1"

rfd = { version = "0.15", default-features = false }
tempfile = "3"
futures-util = "0.3"
sha2 = "0.10"

moxcms = "0.8.1"

base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "exr"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

getrandom = "0.3"
zip = { version = "=9.6.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
