[package]
name = "draivio-image-service-tests"
version = "0.1.0"
edition = "2024"
[dependencies]
serde = {version="1", features=["derive"]}
serde_json="1"
tempfile="3"
sha2="0.10"
getrandom="0.3"
rusqlite = { version = "0.38", features = ["bundled"] }
zip = { version = "=9.6.0", default-features = false }

base64="0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "jpeg"] }
